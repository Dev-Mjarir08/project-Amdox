<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <!-- Modern Vibrant Gradients -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Glassmorphism Filter & Shadows -->
    <filter id="shadowGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) rotate(0deg); opacity: 0.9; }
      50% { transform: scale(1.06) rotate(180deg); opacity: 1; filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.8)); }
    }
    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes shinePass {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    .orb-spin { transform-origin: 100px 120px; animation: pulseOrb 8s ease-in-out infinite; }
    .floating-text { animation: floatNode 4s ease-in-out infinite; }
    .pulse-dot { animation: floatNode 2s ease-in-out infinite alternate; }
  </style>

  <!-- Dark Executive Background Card -->
  <rect width="800" height="240" rx="24" fill="url(#bgGlow)" stroke="#334155" stroke-width="2" />

  <!-- Animated Geometric Logo Icon Mark -->
  <g transform="translate(40, 20)">
    <!-- Outer Orbit Circle -->
    <circle cx="100" cy="100" r="75" fill="none" stroke="url(#primaryGrad)" stroke-width="3" stroke-dasharray="12 8" opacity="0.6" className="orb-spin" />
    <circle cx="100" cy="100" r="60" fill="none" stroke="url(#accentGrad)" stroke-width="2" opacity="0.4" />
    
    <!-- Outer Hexagon / Shield Frame -->
    <polygon points="100,30 160,65 160,135 100,170 40,135 40,65" fill="none" stroke="url(#primaryGrad)" stroke-width="4" filter="url(#shadowGlow)" />

    <!-- Isometric AMDOX Core Cube Nodes -->
    <path d="M100 45 L150 74 L100 103 L50 74 Z" fill="url(#primaryGrad)" opacity="0.95" />
    <path d="M50 74 L100 103 L100 160 L50 131 Z" fill="url(#accentGrad)" opacity="0.85" />
    <path d="M100 103 L150 74 L150 131 L100 160 Z" fill="url(#goldGrad)" opacity="0.88" />

    <!-- Center Pulse Glow Core -->
    <circle cx="100" cy="103" r="10" fill="#ffffff" filter="url(#shadowGlow)" className="pulse-dot" />
  </g>

  <!-- Typography Brand Section -->
  <g transform="translate(240, 115)">
    <!-- AMDOX Main Title -->
    <text x="0" y="10" font-family="System-UI, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="64" letter-spacing="4" fill="#ffffff">
      AMDOX
    </text>
    
    <!-- ERP Badge Banner -->
    <rect x="290" y="-38" width="85" height="36" rx="8" fill="url(#primaryGrad)" />
    <text x="332.5" y="-14" font-family="System-UI, -apple-system, sans-serif" font-weight="800" font-size="18" fill="#ffffff" text-anchor="middle">
      ERP
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="45" font-family="System-UI, -apple-system, sans-serif" font-weight="600" font-size="18" fill="#94a3b8" letter-spacing="1">
      ENTERPRISE RESOURCE PLANNING PLATFORM
    </text>

    <!-- Tech Stack Pill Badges -->
    <g transform="translate(0, 68)">
      <rect x="0" y="0" width="80" height="24" rx="12" fill="#1e293b" stroke="#3b82f6" stroke-width="1.5" />
      <text x="40" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#60a5fa" text-anchor="middle">REACT 19</text>

      <rect x="90" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.5" />
      <text x="132.5" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#34d399" text-anchor="middle">NODE.JS</text>

      <rect x="185" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.5" />
      <text x="227.5" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">MONGODB</text>

      <rect x="280" y="0" width="75" height="24" rx="12" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5" />
      <text x="317.5" y="16" font-family="sans-serif" font-size="11" font-weight="700" fill="#fbbf24" text-anchor="middle">VITE</text>
    </g>
  </g>
</svg>
